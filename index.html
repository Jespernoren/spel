<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Spelhallen">
  <meta name="theme-color" content="#0a0f24">
  <title>Noréns Spelhall</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <style>
    :root {
      --bg: #0a0f24;
      --panel: rgba(255, 255, 255, 0.06);
      --kant: rgba(255, 255, 255, 0.12);
      --text: #f4f6ff;
      --dimmad: #a8b0d6;
      --gul: #ffd43b;
      --rosa: #ff4fa3;
      --cyan: #3de3ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: max(28px, env(safe-area-inset-top)) 18px 60px;
      overflow-x: hidden;
    }

    /* ---------- Stjärnhimmel ---------- */
    #stjarnor { position: fixed; inset: 0; z-index: -1; }
    .glod {
      position: fixed; z-index: -1; border-radius: 50%; filter: blur(90px); opacity: .35;
      pointer-events: none;
    }
    .glod.a { width: 480px; height: 480px; background: #6d3cff; top: -160px; left: -120px; }
    .glod.b { width: 420px; height: 420px; background: #ff3d9a; bottom: -160px; right: -120px; opacity: .22; }

    .wrap { max-width: 1080px; margin: 0 auto; }

    /* ---------- Rubrik ---------- */
    header { text-align: center; margin-bottom: 26px; }
    .skylt {
      display: inline-block; padding: 10px 26px 12px; border-radius: 18px;
      border: 3px solid var(--rosa);
      box-shadow: 0 0 18px rgba(255, 79, 163, .6), inset 0 0 18px rgba(255, 79, 163, .35);
      animation: flimmer 6s infinite;
    }
    .skylt h1 {
      font-size: clamp(30px, 6vw, 54px); font-weight: 900; letter-spacing: 1px;
      color: #fff;
      text-shadow: 0 0 8px var(--rosa), 0 0 22px var(--rosa), 0 0 42px rgba(255, 79, 163, .6);
    }
    .skylt h1 span { color: var(--gul); text-shadow: 0 0 8px var(--gul), 0 0 24px rgba(255, 212, 59, .7); }
    @keyframes flimmer {
      0%, 92%, 100% { opacity: 1; }
      93% { opacity: .55; } 94% { opacity: 1; } 96% { opacity: .7; } 97% { opacity: 1; }
    }
    .under { margin-top: 12px; color: var(--dimmad); font-size: 16px; }

    /* ---------- Filter ---------- */
    .filter { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 30px; }
    .filter button {
      font: inherit; font-size: 16px; font-weight: 700; color: var(--text);
      padding: 10px 20px; border-radius: 999px; cursor: pointer;
      background: var(--panel); border: 1px solid var(--kant);
      transition: transform .12s, background .15s, box-shadow .15s;
    }
    .filter button:hover { transform: translateY(-2px); }
    .filter button.vald {
      background: var(--gul); color: #1a1530; border-color: var(--gul);
      box-shadow: 0 0 18px rgba(255, 212, 59, .55);
    }

    /* ---------- Sektioner ---------- */
    h2 {
      font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: var(--dimmad);
      margin: 0 0 14px 4px;
    }
    section { margin-bottom: 36px; }
    section[hidden] { display: none; }

    /* ---------- Spelkort ---------- */
    .rutnat { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    .kort {
      position: relative; display: flex; flex-direction: column;
      border-radius: 22px; overflow: hidden; text-decoration: none; color: inherit;
      background: var(--panel); border: 1px solid var(--kant);
      transition: transform .18s cubic-bezier(.3, 1.6, .5, 1), box-shadow .18s;
      animation: in .45s both;
    }
    @keyframes in { from { opacity: 0; transform: translateY(14px) scale(.97); } }
    .kort:hover, .kort:focus-visible {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 16px 40px -8px var(--g1), 0 0 0 2px var(--g2);
      outline: none;
    }
    .omslag {
      height: 140px; display: grid; place-items: center; position: relative;
      background: linear-gradient(135deg, var(--g1), var(--g2));
    }
    .omslag::after {
      content: ""; position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 2px, transparent 2px 6px);
    }
    .ikon { font-size: 72px; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .35)); transition: transform .25s; }
    .kort:hover .ikon { transform: scale(1.12) rotate(-6deg); }
    .info { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .info h3 { font-size: 20px; }
    .info p { color: var(--dimmad); font-size: 14px; line-height: 1.45; flex: 1; }
    .fot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .typ { font-size: 12px; color: var(--dimmad); opacity: .85; }
    .rekord { font-size: 13px; font-weight: 700; color: var(--gul); white-space: nowrap; }

    .etikett {
      position: absolute; top: 12px; right: 12px; z-index: 2;
      font-size: 12px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase;
      padding: 5px 10px; border-radius: 999px;
    }
    .etikett.ny { background: var(--gul); color: #1a1530; box-shadow: 0 0 14px rgba(255, 212, 59, .7); }
    .etikett.snart { background: rgba(10, 15, 36, .75); color: #fff; border: 1px solid rgba(255,255,255,.25); }

    .kort.snart { cursor: default; }
    .kort.snart .omslag { filter: saturate(.35) brightness(.75); }
    .kort.snart:hover { transform: none; box-shadow: none; }
    .kort.snart:hover .ikon { transform: none; }

    /* Senast spelat: mindre kort */
    .rad { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
    .rad::-webkit-scrollbar { display: none; }
    .mini {
      flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
      padding: 10px 18px 10px 10px; border-radius: 16px; text-decoration: none; color: inherit;
      background: var(--panel); border: 1px solid var(--kant); transition: transform .15s;
    }
    .mini:hover { transform: translateY(-3px); }
    .mini .bubbla {
      width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 26px;
      background: linear-gradient(135deg, var(--g1), var(--g2));
    }
    .mini b { display: block; font-size: 15px; }
    .mini small { color: var(--dimmad); font-size: 12px; }

    footer { text-align: center; color: var(--dimmad); font-size: 13px; opacity: .7; }
    .tom { color: var(--dimmad); padding: 20px 4px; }

    @media (max-width: 520px) {
      .rutnat { grid-template-columns: 1fr 1fr; gap: 12px; }
      .omslag { height: 104px; }
      .ikon { font-size: 52px; }
      .info { padding: 12px; }
      .info h3 { font-size: 16px; }
      .info p, .typ { display: none; }
      .filter button { padding: 8px 14px; font-size: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="stjarnor"></canvas>
  <div class="glod a"></div>
  <div class="glod b"></div>

  <div class="wrap">
    <header>
      <div class="skylt"><h1>NORÉNS <span>SPELHALL</span></h1></div>
      <p class="under" id="halsning">Välj ett spel och kör! 🎮</p>
    </header>

    <nav class="filter" id="filter"></nav>

    <section id="senast" hidden>
      <h2>▶ Fortsätt spela</h2>
      <div class="rad" id="senastRad"></div>
    </section>

    <section>
      <h2 id="rubrik">Alla spel</h2>
      <div class="rutnat" id="lista"></div>
    </section>

    <footer id="fot"></footer>
  </div>

  <script src="spel-lista.js"></script>
  <script>
    // ---------- Små hjälpare ----------
    const lagring = {
      hamta(n, std) { try { const v = localStorage.getItem(n); return v === null ? std : JSON.parse(v); } catch { return std; } },
      spara(n, v) { try { localStorage.setItem(n, JSON.stringify(v)); } catch {} },
    };
    const rekordFor = (mapp) => { try { return Number(localStorage.getItem('rekord:' + mapp)) || 0; } catch { return 0; } };
    const fargStil = (s) => `--g1:${s.farg[0]};--g2:${s.farg[1]}`;
    const SPEL = window.SPEL || [];

    // ---------- Direktlänk till ett spel: index.html#slalom ----------
    function oppnaDirektlank() {
      const direkt = location.hash.slice(1);
      if (direkt && SPEL.some((s) => s.mapp === direkt && s.status === 'klar')) {
        location.replace(`spel/${direkt}/index.html`);
      }
    }
    oppnaDirektlank();
    addEventListener('hashchange', oppnaDirektlank);

    // ---------- Pling-ljud vid klick ----------
    let ac;
    function pling() {
      try {
        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'square';
        o.frequency.setValueAtTime(660, ac.currentTime);
        o.frequency.setValueAtTime(990, ac.currentTime + 0.07);
        g.gain.setValueAtTime(0.08, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.2);
        o.connect(g).connect(ac.destination);
        o.start(); o.stop(ac.currentTime + 0.2);
      } catch {}
    }

    // ---------- Hälsning efter tid på dygnet ----------
    const h = new Date().getHours();
    document.getElementById('halsning').textContent =
      h < 10 ? 'God morgon! Dags för ett spel? ☀️' :
      h < 17 ? 'Välj ett spel och kör! 🎮' :
      h < 21 ? 'Kvällsspel? Välj ett! 🌙' : 'Ett sista spel innan läggdags? 😴';

    // ---------- Filter ----------
    const personer = ['Alla', ...new Set(SPEL.flatMap((s) => s.spelare).filter((p) => p !== 'Alla'))];
    const ikoner = { Alla: '🎮', Charlie: '🦄', Beppe: '🏰', Simon: '⚔️' };
    let filter = lagring.hamta('spelhall:filter', 'Alla');
    if (!personer.includes(filter)) filter = 'Alla';

    function ritaFilter() {
      const nav = document.getElementById('filter');
      nav.innerHTML = '';
      for (const p of personer) {
        const b = document.createElement('button');
        b.textContent = `${ikoner[p] || '🙂'} ${p}`;
        if (p === filter) b.className = 'vald';
        b.onclick = () => { filter = p; lagring.spara('spelhall:filter', p); ritaFilter(); ritaLista(); };
        nav.appendChild(b);
      }
    }

    // ---------- Spelkort ----------
    function ritaLista() {
      const lista = document.getElementById('lista');
      const urval = SPEL.filter((s) => filter === 'Alla' || s.spelare.includes(filter) || s.spelare.includes('Alla'));
      // spelbara först
      urval.sort((a, b) => (a.status === 'klar' ? 0 : 1) - (b.status === 'klar' ? 0 : 1));
      document.getElementById('rubrik').textContent = filter === 'Alla' ? 'Alla spel' : `${filter}s spel`;
      lista.innerHTML = '';
      if (!urval.length) { lista.innerHTML = '<p class="tom">Inga spel här än.</p>'; return; }

      urval.forEach((s, i) => {
        const klar = s.status === 'klar';
        const el = document.createElement(klar ? 'a' : 'div');
        el.className = 'kort' + (klar ? '' : ' snart');
        el.style.cssText = fargStil(s) + `;animation-delay:${i * 50}ms`;
        if (klar) {
          el.href = `spel/${s.mapp}/index.html`;
          el.onclick = (e) => {
            e.preventDefault();
            pling();
            const senast = lagring.hamta('spelhall:senast', []).filter((m) => m !== s.mapp);
            lagring.spara('spelhall:senast', [s.mapp, ...senast].slice(0, 5));
            setTimeout(() => (location.href = el.href), 160);
          };
        }
        const rek = rekordFor(s.mapp);
        el.innerHTML = `
          ${!klar ? '<span class="etikett snart">Snart</span>' : s.ny ? '<span class="etikett ny">Ny!</span>' : ''}
          <div class="omslag"><div class="ikon">${s.ikon}</div></div>
          <div class="info">
            <h3>${s.namn}</h3>
            <p>${s.beskrivning}</p>
            <div class="fot">
              <span class="typ">${s.typ || ''}</span>
              ${rek ? `<span class="rekord">🏆 ${rek}</span>` : ''}
            </div>
          </div>`;
        lista.appendChild(el);
      });
    }

    // ---------- Senast spelat ----------
    function ritaSenast() {
      const senast = lagring.hamta('spelhall:senast', [])
        .map((m) => SPEL.find((s) => s.mapp === m && s.status === 'klar'))
        .filter(Boolean);
      const sek = document.getElementById('senast');
      if (!senast.length) return;
      sek.hidden = false;
      const rad = document.getElementById('senastRad');
      for (const s of senast) {
        const a = document.createElement('a');
        a.className = 'mini';
        a.href = `spel/${s.mapp}/index.html`;
        a.style.cssText = fargStil(s);
        const rek = rekordFor(s.mapp);
        a.innerHTML = `<div class="bubbla">${s.ikon}</div><div><b>${s.namn}</b><small>${rek ? '🏆 Rekord ' + rek : 'Spela igen'}</small></div>`;
        a.onclick = () => pling();
        rad.appendChild(a);
      }
    }

    // ---------- Sidfot ----------
    const antalKlara = SPEL.filter((s) => s.status === 'klar').length;
    document.getElementById('fot').textContent =
      `${antalKlara} spelbara · ${SPEL.length - antalKlara} på väg · Byggt av familjen Norén`;

    ritaFilter();
    ritaSenast();
    ritaLista();

    // ---------- Blinkande stjärnor ----------
    const cv = document.getElementById('stjarnor'), cx = cv.getContext('2d');
    let stj = [];
    function storlek() {
      cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
      stj = Array.from({ length: Math.round(innerWidth * innerHeight / 9000) }, () => ({
        x: Math.random() * cv.width, y: Math.random() * cv.height,
        r: (Math.random() * 1.3 + 0.3) * devicePixelRatio, f: Math.random() * 6.28, v: Math.random() * 0.02 + 0.005,
      }));
    }
    function stjarnRuta() {
      cx.clearRect(0, 0, cv.width, cv.height);
      for (const s of stj) {
        s.f += s.v;
        cx.globalAlpha = 0.35 + Math.sin(s.f) * 0.3;
        cx.fillStyle = '#fff';
        cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.28); cx.fill();
      }
      requestAnimationFrame(stjarnRuta);
    }
    addEventListener('resize', storlek);
    storlek();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) stjarnRuta();
  </script>
</body>
</html>
