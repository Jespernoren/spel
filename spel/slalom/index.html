<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1020">
  <title>Slalom ⛷️ – Noréns spelhall</title>
  <link rel="stylesheet" href="../../delat/extra.css">
  <style>
    .meddelande {
      position: fixed; left: 50%; top: 32%; transform: translate(-50%, -50%);
      font-size: clamp(42px, 11vw, 110px); font-weight: 900; color: #fff; z-index: 8;
      text-shadow: 0 4px 0 rgba(0,0,0,.25), 0 0 30px rgba(0,0,0,.35);
      pointer-events: none; white-space: nowrap; transition: opacity .25s;
    }
    .meddelande.liten { font-size: clamp(24px, 6vw, 46px); top: 22%; }
    .meddelande.gron { color: #6cff9a; }
    .meddelande.rod { color: #ff6b6b; }
    .meddelande.guld { color: #ffd54a; }
    .backval { display: grid; gap: 10px; text-align: left; }
    .backe {
      font: inherit; color: #fff; border: 0; cursor: pointer; border-radius: 18px;
      padding: 14px 16px; display: flex; align-items: center; gap: 14px;
      background: rgba(255,255,255,.1); transition: transform .1s, background .15s;
    }
    .backe:hover, .backe:focus-visible { background: rgba(255,255,255,.2); transform: scale(1.02); outline: none; }
    .backe .symbol { font-size: 34px; }
    .backe b { font-size: 20px; display: block; }
    .backe span { font-size: 14px; opacity: .8; }
    .backe .medalj { margin-left: auto; font-size: 30px; }
    .hjalp { font-size: 14px; opacity: .75; margin-top: 12px; line-height: 1.5; }
    .resultat { width: 100%; border-collapse: collapse; font-size: 18px; margin: 6px 0 4px; }
    .resultat td { text-align: left; padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,.1); }
    .resultat td:last-child { text-align: right; font-weight: 800; }
    .resultat tr.total td { font-size: 24px; border: 0; padding-top: 10px; }
    .nytt-rekord { color: #ffd54a; font-weight: 900; font-size: 22px; animation: puls .8s infinite alternate; }
    @keyframes puls { to { transform: scale(1.08); } }
    .hud .delta-gron { color: #6cff9a; }
    /* Pop-mätare: pilen rör sig mot hoppkanten, tryck Enter i gröna zonen */
    .popmatare {
      position: fixed; left: 50%; bottom: max(120px, calc(env(safe-area-inset-bottom) + 110px)); transform: translateX(-50%);
      width: min(420px, 80vw); z-index: 7; pointer-events: none; text-align: center;
    }
    .pop-text { font-weight: 900; font-size: 18px; margin-bottom: 6px; text-shadow: 0 2px 6px rgba(0,0,0,.45); }
    .pop-bar { position: relative; height: 18px; border-radius: 9px; background: rgba(10,16,40,.55); border: 2px solid rgba(255,255,255,.6); overflow: hidden; }
    .pop-zon { position: absolute; top: 0; bottom: 0; right: 0; width: 25%; background: linear-gradient(90deg, #3ddc84aa, #3ddc84); }
    .pop-zon::after { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 5px; background: #1e6bff; }
    .pop-pil { position: absolute; top: -2px; bottom: -2px; width: 6px; margin-left: -3px; background: #fff; border-radius: 3px; box-shadow: 0 0 8px #fff; }
    .popmatare.poppad .pop-bar { border-color: #6cff9a; }
    .popmatare.haller .pop-pil { background: #ffd54a; box-shadow: 0 0 10px #ffd54a; }
    /* Namnskyltar över datoråkarna */
    .namnskylt {
      position: fixed; left: 0; top: 0; z-index: 3; pointer-events: none; white-space: nowrap;
      background: rgba(10,16,40,.6); border-radius: 10px; padding: 3px 9px; font-size: 13px; font-weight: 800;
      display: flex; align-items: center; gap: 6px;
    }
    .namnskylt span, .resultat .prick { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
    .resultat .prick { margin: 0 6px 0 2px; vertical-align: middle; }
    .resultat tr.jag td { color: #ffd54a; }
    .detaljer { font-size: 14px; opacity: .8; }
    /* Positionsstapel till höger: vem leder? */
    .positionsstapel {
      position: fixed; right: 18px; top: 50%; transform: translateY(-50%); height: min(46vh, 320px); width: 10px;
      background: rgba(10,16,40,.45); border-radius: 6px; z-index: 5; pointer-events: none;
    }
    .stapel-mal { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); font-size: 18px; }
    .stapel-prick {
      position: absolute; left: 50%; width: 20px; height: 20px; margin: 0 0 -10px -10px; border-radius: 50%;
      border: 2px solid #fff; font-size: 11px; line-height: 16px; text-align: center; color: #fff; font-weight: 900;
      box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: bottom .1s linear;
    }
    /* Pumptips på kullarna */
    .pumptips {
      position: fixed; left: 50%; bottom: max(130px, calc(env(safe-area-inset-bottom) + 120px)); transform: translateX(-50%);
      z-index: 7; pointer-events: none; font-weight: 900; font-size: 20px; padding: 6px 14px; border-radius: 12px;
      background: rgba(10,16,40,.5); text-shadow: 0 2px 6px rgba(0,0,0,.4);
    }
    .pumptips.bra { color: #6cff9a; }
    .pumptips.fel { color: #ffb4b4; }
    .hud .plats { font-size: 30px; }
    /* Kontrollskylt i början av åket */
    .kontrollskylt {
      position: fixed; left: 50%; bottom: max(150px, calc(env(safe-area-inset-bottom) + 140px)); transform: translateX(-50%);
      z-index: 7; pointer-events: none; background: rgba(10,16,40,.62); border-radius: 16px; padding: 12px 18px;
      display: grid; gap: 8px; font-weight: 700; font-size: 16px; white-space: nowrap;
    }
    .kontrollskylt kbd {
      display: inline-block; min-width: 30px; padding: 3px 8px; border-radius: 7px; text-align: center;
      background: #fff; color: #111; font: 900 15px system-ui, sans-serif; box-shadow: 0 3px 0 #9aa4b1;
    }
    .kontrollskylt kbd.lang { min-width: 130px; }
    .kontrollskylt span { opacity: .9; margin-left: 6px; }
    .hud .plats .p1 { color: #ffd54a; } .hud .plats .p2 { color: #e0e6f0; } .hud .plats .p3 { color: #f0a868; }
    .popmatare.poppad .pop-text { color: #6cff9a; }
    .hud .delta-rod { color: #ff8a8a; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <script type="module" src="spel.js"></script>
</body>
</html>
