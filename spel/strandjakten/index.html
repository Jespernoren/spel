<!doctype html>
<html lang="sv">
<head>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strandjakten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#f7e3b5; --sand-mork:#e2bf7c; --hav:#14a6c4; --hav-mork:#0b6f8a;
  --rosa:#ff6fae; --text:#3a2a1c; --panel:#fffaf0; --kant:#3a2a1c; --dampad:#7a6450;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:#1d2a33; --text:#fdf3dc; --kant:#0a141a; --dampad:#b9c7cf; color-scheme:dark; }
}
:root[data-theme="dark"]{ --panel:#1d2a33; --text:#fdf3dc; --kant:#0a141a; --dampad:#b9c7cf; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden;background:#7fd3e8;font-family:"Fredoka",system-ui,"Segoe UI",sans-serif;color:var(--text)}
#spel{position:fixed;inset:0}
#spel canvas{display:block;width:100%;height:100%}
.dold{display:none!important}

/* HUD */
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);display:flex;gap:10px;pointer-events:none;z-index:5}
.plats{width:68px;height:68px;border-radius:18px;background:rgba(255,250,240,.55);border:3px solid rgba(58,42,28,.35);display:grid;place-items:center;transition:transform .3s, background .3s}
.plats svg{width:48px;height:48px;opacity:.28;filter:grayscale(1)}
.plats.hittad{background:var(--panel);border-color:var(--kant);transform:scale(1.08)}
.plats.hittad svg{opacity:1;filter:none}
.plats.pop{animation:pop .6s}
@keyframes pop{40%{transform:scale(1.35)}}
#tid{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;font-weight:700;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);z-index:5;pointer-events:none}
#medd{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);width:max-content;max-width:min(860px,94vw);background:var(--panel);border:4px solid var(--kant);border-radius:20px;padding:10px 22px;font-size:22px;font-weight:600;text-align:center;box-shadow:0 6px 0 var(--kant);z-index:6;pointer-events:none;transition:opacity .3s}
#medd.osynlig{opacity:0}
#pekplatta{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:6px;z-index:7}
#pekplatta button{font:inherit;font-size:28px;font-weight:700;border-radius:16px;border:3px solid var(--kant);background:rgba(255,250,240,.85);color:#3a2a1c;touch-action:none;user-select:none;-webkit-user-select:none}
#pekplatta button:active{background:#ffd23f}
@media (hover:hover) and (pointer:fine){#pekplatta{display:none!important}}
#tjuvvarning{position:fixed;top:96px;left:50%;transform:translateX(-50%);font-size:34px;font-weight:700;color:#fff;background:#d6336c;border:4px solid var(--kant);border-radius:20px;padding:6px 22px;box-shadow:0 6px 0 var(--kant);z-index:6;animation:blink .7s infinite alternate;pointer-events:none}
@keyframes blink{to{transform:translateX(-50%) scale(1.07)}}

/* Skärmar */
.skarm{position:fixed;inset:0;display:grid;place-items:center;z-index:10;padding:16px;overflow:auto}
.skarm.tona{background:rgba(10,60,80,.45)}
.kort{background:var(--panel);border:5px solid var(--kant);border-radius:32px;box-shadow:0 10px 0 var(--kant);padding:28px 34px;max-width:min(760px,96vw);text-align:center}
h1{font-size:clamp(54px,9vw,96px);line-height:.95;margin:0 0 8px;font-weight:700;letter-spacing:.01em;
  background:linear-gradient(180deg,#ff4d4d 0 17%,#ff9f1c 17% 34%,#ffd23f 34% 51%,#3ecf6e 51% 68%,#2f9bff 68% 85%,#9b5cff 85%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px var(--kant);paint-order:stroke fill}
.ingress{font-size:22px;line-height:1.35;margin:4px auto 18px;max-width:34em;font-weight:500}
.rad{display:flex;justify-content:center;gap:12px;margin:10px 0 18px;flex-wrap:wrap}
.rad .plats{background:#fff;border-color:var(--kant)}
.rad .plats svg{opacity:1;filter:none}
.knapp{font:inherit;font-size:30px;font-weight:700;color:#fff;background:var(--rosa);border:4px solid var(--kant);border-radius:22px;padding:12px 44px;box-shadow:0 7px 0 var(--kant);cursor:pointer}
.knapp:hover{filter:brightness(1.06)}
.knapp:active{transform:translateY(5px);box-shadow:0 2px 0 var(--kant)}
.knapp:focus-visible{outline:4px solid #2f9bff;outline-offset:4px}
.knapp.bla{background:var(--hav)}
.styr{display:flex;justify-content:center;gap:26px;margin-top:20px;font-size:17px;color:var(--dampad);flex-wrap:wrap}
.styr b{display:inline-block;min-width:30px;padding:2px 7px;border:2px solid var(--dampad);border-radius:8px;margin:0 2px;color:var(--text)}
.rekord{margin-top:10px;font-size:17px;color:var(--dampad)}

/* Hänga gubbe */
#gubbe .kort{max-width:min(920px,97vw);padding:20px 24px}
.gubbe-topp{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:6px}
.gubbe-topp h2{margin:0;font-size:30px}
.gubbe-yta{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:center}
#gubbeRita{width:230px;height:230px;background:#eaf8fc;border:4px solid var(--kant);border-radius:20px}
.ledtrad{display:flex;align-items:center;gap:10px;justify-content:center;font-size:23px;font-weight:600;background:#fff4c2;color:#3a2a1c;border:3px solid var(--kant);border-radius:16px;padding:10px 14px}
.lyssna{font-size:26px;width:52px;height:52px;flex:none;border-radius:50%;border:3px solid var(--kant);background:#fff;cursor:pointer}
#ord{display:flex;justify-content:center;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
#ord span{width:48px;height:58px;border-bottom:6px solid var(--kant);font-size:42px;font-weight:700;display:grid;place-items:end center;padding-bottom:2px}
#bokstaver{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
#bokstaver button{font:inherit;font-size:23px;font-weight:700;height:44px;border-radius:12px;border:3px solid var(--kant);background:#fff;color:#3a2a1c;cursor:pointer;box-shadow:0 3px 0 var(--kant)}
#bokstaver button:disabled{cursor:default;box-shadow:none;transform:translateY(3px)}
#bokstaver button.ratt{background:#7ee29b}
#bokstaver button.fel{background:#ffb3b3;opacity:.6}
.liv{font-size:19px;color:var(--dampad);margin-top:8px}
#gubbeSlut{margin-top:12px}
#gubbeSlut p{font-size:24px;font-weight:600;margin:6px 0 14px}
@media (max-width:640px){.gubbe-yta{grid-template-columns:1fr}#gubbeRita{margin:0 auto;width:170px;height:170px}#bokstaver{grid-template-columns:repeat(8,1fr)}}
@media (prefers-reduced-motion:reduce){#tjuvvarning,.plats.pop{animation:none}}
</style>
</head>
<body>
<div id="spel"></div>
<div id="hud" class="dold"></div>
<div id="tid" class="dold">0:00</div>
<div id="tjuvvarning" class="dold">Tjuven kommer!</div>
<div id="medd" class="osynlig"></div>
<div id="pekplatta" class="dold">
  <span></span><button data-t="ArrowUp" aria-label="Gå framåt">▲</button><span></span>
  <button data-t="ArrowLeft" aria-label="Sväng vänster">◀</button><button data-t="ArrowDown" aria-label="Gå bakåt">▼</button><button data-t="ArrowRight" aria-label="Sväng höger">▶</button>
</div>

<div id="start" class="skarm tona">
  <div class="kort">
    <h1>Strandjakten</h1>
    <p class="ingress">Mamma, barnet och bebisen har tappat sina kläder på stranden. Hitta alla fem, slå tjuven i hänga gubbe och fira med poolparty!</p>
    <div class="rad" id="startIkoner"></div>
    <button class="knapp" id="spelaKnapp">Spela!</button>
    <div class="styr">
      <span>Gå: <b>↑</b><b>↓</b> eller <b>W</b><b>S</b></span>
      <span>Sväng: <b>←</b><b>→</b> eller <b>A</b><b>D</b></span>
      <span>Spring: <b>Shift</b></span>
    </div>
    <div class="rekord" id="rekordText"></div>
    <div class="rekord">En idé av Charlie</div>
  </div>
</div>

<div id="paus" class="skarm tona dold">
  <div class="kort"><h2 style="font-size:40px;margin:0 0 14px">Paus</h2><button class="knapp bla" id="fortsattKnapp">Fortsätt</button></div>
</div>

<div id="gubbe" class="skarm tona dold">
  <div class="kort">
    <div class="gubbe-topp"><h2 id="gubbeRubrik">Tjuven vill ta kläderna!</h2></div>
    <div class="gubbe-yta">
      <canvas id="gubbeRita" width="460" height="460"></canvas>
      <div>
        <div class="ledtrad"><button class="lyssna" id="lyssnaKnapp" aria-label="Läs upp ledtråden">🔊</button><span id="ledtradText"></span></div>
        <div id="ord"></div>
        <div id="bokstaver"></div>
        <div class="liv" id="livText"></div>
      </div>
    </div>
    <div id="gubbeSlut" class="dold"><p id="gubbeSlutText"></p><button class="knapp" id="gubbeVidare">Fortsätt</button></div>
  </div>
</div>

<div id="fest" class="skarm dold" style="place-items:end center;padding-bottom:24px">
  <div class="kort" style="padding:16px 28px">
    <h1 style="font-size:clamp(46px,7vw,76px)">Poolparty!</h1>
    <p class="ingress" id="festText"></p>
    <button class="knapp" id="igenKnapp">Spela igen</button>
  </div>
</div>

<script type="module" src="spel.js"></script>
<script src="../../delat/hem.js"></script>
</body>
</html>
