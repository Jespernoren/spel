<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Majistos Torn</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { height:100%; overflow:hidden; font-family:'Comic Sans MS','Trebuchet MS',sans-serif; }
  body { background:#6a8ec8; display:flex; align-items:center; justify-content:center; touch-action:manipulation; }
  #game {
    position:relative; width:100%; height:100%; max-width:900px; max-height:760px;
    background:#bcdaf4; overflow:hidden; box-shadow:0 0 40px rgba(0,0,0,.4);
  }

  /* ===== Background layers ===== */
  .space-layer { position:absolute; inset:0; z-index:1; pointer-events:none; opacity:0;
    background:linear-gradient(180deg,#02011a 0%,#0a0a3a 40%,#1a2a6a 75%,#3a5fb0 100%);
    transition:opacity 1.1s ease; }
  .space-layer .star { position:absolute; background:#fff; border-radius:50%; animation:twinkle 2.5s infinite; }
  .castle-bg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1;
    filter:blur(3px) saturate(0.92) brightness(1.04); transform:scale(1.04) translateY(0px);
    transition:transform 1.1s cubic-bezier(.4,0,.2,1); will-change:transform; }
  .bg-haze { position:absolute; inset:0; z-index:2; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.10) 35%, rgba(255,255,255,0) 55%, rgba(255,255,255,.14) 100%); }
  .world-ground { position:absolute; left:0; right:0; bottom:-70px; height:160px; z-index:3; pointer-events:none;
    transition:transform 1.1s cubic-bezier(.4,0,.2,1); will-change:transform; }
  .world-ground svg { width:100%; height:100%; display:block; }
  .drift-cloud { position:absolute; z-index:4; pointer-events:none; opacity:0;
    background:radial-gradient(circle,#fff 60%,rgba(255,255,255,.6) 100%); border-radius:50%; filter:blur(1px); }

  /* ===== Top bar ===== */
  .topbar { position:absolute; top:0; left:54px; right:0; height:60px; display:flex;
    align-items:center; justify-content:space-between; padding:0 14px; z-index:50; }
  .iconbtn { background:linear-gradient(180deg,#ffe07a,#ffce3a); border:3px solid #d49a1a; border-radius:16px;
    font-size:24px; padding:4px 12px; cursor:pointer; box-shadow:0 4px 0 #b07d00; }
  .iconbtn:active { transform:translateY(3px); box-shadow:0 1px 0 #b07d00; }
  .iconbtn.off { filter:grayscale(1) opacity(.55); }
  .floorcount { background:linear-gradient(180deg,#fff,#f0f0f5); border:3px solid #ffce3a; border-radius:16px;
    padding:5px 18px; font-size:22px; font-weight:bold; color:#3a5fa0; box-shadow:0 4px 0 rgba(0,0,0,.12); }

  /* ===== Screens ===== */
  .screen { position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; z-index:20; padding-top:60px; }
  .screen.active { display:flex; animation:screenIn .4s ease; }
  @keyframes screenIn { 0%{opacity:0;transform:scale(.98);} 100%{opacity:1;transform:scale(1);} }
  #play, #scene { padding-left:185px; }
  @media (max-width:600px){
    .tower-panel { width:92px !important; left:46px !important; } #play, #scene { padding-left:145px; }
    .ruler { width:42px; }
  }

  /* ===== Majisto SVG ===== */
  .majisto-svg { width:150px; height:210px; flex:0 0 auto; }
  .majisto-svg.big { width:200px; height:280px; }
  .majisto-svg svg { width:100%; height:100%; overflow:visible; display:block; filter:drop-shadow(0 8px 10px rgba(0,0,0,.28)); }
  .m-armR { transform-origin:140px 150px; animation:wave 1.6s ease-in-out infinite; }
  @keyframes wave { 0%,100%{transform:rotate(-6deg);} 50%{transform:rotate(-26deg);} }
  .majisto-svg.cheer .m-armR,.majisto-svg.cheer .m-armL { animation:waveBig .5s ease-in-out infinite; }
  .majisto-svg.cheer .m-armL { transform-origin:60px 150px; }
  @keyframes waveBig { 0%,100%{transform:rotate(-10deg);} 50%{transform:rotate(-40deg);} }
  .m-wandStar { transform-origin:center; animation:twinkle 1s infinite; }
  @keyframes twinkle { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.4;transform:scale(1.4);} }
  .majisto-svg.undies .m-robe-full { display:none; }
  .m-undies-grp { display:none; }
  .majisto-svg.undies .m-undies-grp { display:block; }
  .anim-wiggle { animation:wiggleLegs .5s ease-in-out infinite; }
  @keyframes wiggleLegs { 0%,100%{transform:rotate(-3deg) translateY(0);} 25%{transform:rotate(2deg) translateY(-4px);} 75%{transform:rotate(-2deg) translateY(-4px);} }
  .anim-tummy { animation:tummyShake .25s ease-in-out infinite; }
  @keyframes tummyShake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px) scale(1.01);} 75%{transform:translateX(5px) scale(1.01);} }
  .anim-sneeze { animation:sneezeUp 1.2s ease-out; }
  @keyframes sneezeUp { 0%{transform:translateY(0) scale(1);} 20%{transform:translateY(-4px) scale(1.03);}
    35%{transform:translateY(2px) scale(.97) rotate(-7deg);} 55%{transform:translateY(-2px) rotate(4deg);} 100%{transform:translateY(0) rotate(0) scale(1);} }
  .anim-relief { animation:reliefBounce .6s ease-out; }
  @keyframes reliefBounce { 0%{transform:translateY(0);} 40%{transform:translateY(-10px);} 100%{transform:translateY(0);} }
  .anim-jump { animation:jumpJoy .6s ease-out; }
  @keyframes jumpJoy { 0%{transform:translateY(0);} 30%{transform:translateY(-18px);} 60%{transform:translateY(0);} 80%{transform:translateY(-6px);} 100%{transform:translateY(0);} }

  /* ===== Start screen ===== */
  #start h1 { color:#fff; font-size:clamp(30px,8vw,58px); text-align:center;
    text-shadow:3px 3px 0 #2a4fb0,6px 6px 0 rgba(0,0,0,.2); margin:6px 20px; }
  #start p { color:#fff; font-size:clamp(16px,3.5vw,22px); margin:4px 20px 14px;
    text-shadow:2px 2px 0 rgba(0,0,0,.3); text-align:center; }
  .bigbtn { background:linear-gradient(180deg,#ffe07a,#ffce3a); border:5px solid #d49a1a; border-radius:30px;
    color:#7a4a00; font-size:clamp(22px,5vw,34px); font-weight:bold; padding:16px 48px; cursor:pointer;
    box-shadow:0 8px 0 #b07d00, 0 12px 18px rgba(0,0,0,.25); margin-top:8px; font-family:inherit;
    animation:btnPulse 2s ease-in-out infinite; }
  .bigbtn:active { transform:translateY(5px); box-shadow:0 3px 0 #b07d00; }
  @keyframes btnPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.04);} }

  .banner { position:absolute; top:70px; left:50%; transform:translateX(-50%);
    background:linear-gradient(180deg,#fff,#f4f4f8); border:5px solid #ffce3a; border-radius:22px; padding:9px 28px;
    font-size:clamp(17px,4vw,24px); color:#3a5fa0; font-weight:bold; z-index:40;
    box-shadow:0 6px 0 rgba(0,0,0,.13); white-space:nowrap; animation:bannerDrop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes bannerDrop { 0%{transform:translate(-50%,-40px);opacity:0;} 100%{transform:translate(-50%,0);opacity:1;} }
  .hint { color:#fff; font-size:clamp(15px,3.6vw,21px); margin-top:12px;
    text-shadow:2px 2px 0 rgba(0,0,0,.3); text-align:center; padding:0 20px; font-weight:bold; }
  .replaybtn { background:#ffce3a; border:3px solid #d49a1a; border-radius:14px; font-size:18px; padding:6px 14px;
    cursor:pointer; box-shadow:0 4px 0 #b07d00; margin-top:14px; font-family:inherit; color:#7a4a00; font-weight:bold; }

  /* ===== Tower panel ===== */
  .tower-panel { position:absolute; left:52px; top:0; bottom:0; width:120px; z-index:34; overflow:hidden; pointer-events:none; }
  .tower-world { position:absolute; left:0; right:0; bottom:0; top:0;
    transition:transform 1.1s cubic-bezier(.4,0,.2,1); will-change:transform; }
  .panel-sky { position:absolute; left:0; right:0; bottom:0; width:100%; filter:blur(3px);
    background:linear-gradient(180deg,#020014 0%,#0a0a3a 5%,#1a2a7a 11%,#3a5fb0 19%,#6a92d8 28%,#9bc2ec 37%,
      #bcdaf4 46%,rgba(207,230,245,0.9) 55%,rgba(227,238,247,0.5) 62%,rgba(227,238,247,0) 68%); }
  .panel-deco { position:absolute; left:0; right:0; pointer-events:none; }
  .panel-star { position:absolute; background:#fff; border-radius:50%; animation:twinkle 2.5s infinite; }

  /* tower grows UP from a bottom-anchored base */
  .tower-inner { position:absolute; left:50%; bottom:66px; transform:translateX(-50%);
    display:flex; flex-direction:column-reverse; align-items:center; transform-origin:bottom center; z-index:5; }
  .tower-inner.sway { animation:sway var(--sd,4s) ease-in-out infinite; }
  @keyframes sway { 0%,100%{transform:translateX(-50%) rotate(calc(var(--sw,0deg) * -1));} 50%{transform:translateX(-50%) rotate(var(--sw,0deg));} }

  .tfloor { position:relative; width:80px; height:34px; margin-top:-2px;
    border:1.5px solid #5a5a5f; border-radius:7px;
    box-shadow:inset 0 -4px 6px rgba(0,0,0,.22), inset 0 3px 5px rgba(255,255,255,.22),
      inset 2px 0 4px rgba(0,0,0,.1), inset -2px 0 4px rgba(0,0,0,.1), 0 2px 3px rgba(0,0,0,.25);
    display:flex; align-items:center; justify-content:center; gap:6px; overflow:hidden; }
  .tfloor.w1 { width:84px; } .tfloor.w2 { width:76px; } .tfloor.w3 { width:82px; } .tfloor.w4 { width:78px; }
  /* SVG procedural fieldstone fills .bricks (set in JS) */
  .tfloor .bricks { position:absolute; inset:0; z-index:0; overflow:hidden; }
  .tfloor .bricks svg { position:absolute; inset:0; width:100%; height:100%; }
  .tfloor > *:not(.bricks) { position:relative; z-index:1; }
  .tfloor.v0{--brick:#9a9a9e}.tfloor.v1{--brick:#a89484}.tfloor.v2{--brick:#8d8d96}.tfloor.v3{--brick:#9c8d7a}
  .tfloor.v4{--brick:#8a9a8d}.tfloor.v5{--brick:#a89a9a}.tfloor.v6{--brick:#94928c}.tfloor.v7{--brick:#9a8f7e}
  .tfloor.v8{--brick:#8f9aa6}.tfloor.v9{--brick:#a99b6f}.tfloor.v10{--brick:#94817a}.tfloor.v11{--brick:#88928a}
  .tfloor.v12{--brick:#9e9aa2}.tfloor.v13{--brick:#a08c74}.tfloor.v14{--brick:#8c8c90}
  .tfloor .win { width:13px; height:18px; background:#3a2f1a; border:2px solid #5a4a2a; border-radius:7px 7px 2px 2px; }
  .tfloor .win.lit { background:radial-gradient(circle at 50% 35%,#ffe28a,#ffb43a); box-shadow:0 0 7px #ffce5a; }
  .tfloor .torch { position:absolute; bottom:6px; width:4px; height:11px; background:#6a4a2a; }
  .tfloor .torch::after { content:''; position:absolute; top:-7px; left:-2px; width:8px; height:9px;
    background:radial-gradient(circle at 50% 70%,#ffe14d,#ff7e1a); border-radius:50%; box-shadow:0 0 6px #ffb43a; animation:flick .4s infinite alternate; }
  @keyframes flick { 0%{opacity:.8;transform:scale(.9);} 100%{opacity:1;transform:scale(1.1);} }
  .tfloor .torch.l { left:7px; } .tfloor .torch.r { right:7px; }
  .tfloor .vines { position:absolute; bottom:0; left:0; width:14px; height:100%;
    background:radial-gradient(circle at 50% 20%,#5f9444 3px,transparent 3px) 0 0/8px 10px; opacity:.8; }
  .tfloor .flagm { position:absolute; top:-2px; right:6px; width:3px; height:14px; background:#5a4a2a; }
  .tfloor .flagm::after { content:''; position:absolute; top:0; left:3px; width:10px; height:7px; background:#3a7ad0; clip-path:polygon(0 0,100% 0,100% 100%,0 100%,30% 50%); }
  .tfloor .banner-deco { position:absolute; left:-6px; top:6px; width:8px; height:22px; background:#b03030; clip-path:polygon(0 0,100% 0,100% 80%,50% 100%,0 80%); }
  .tfloor.new { animation:swoosh .8s cubic-bezier(.4,0,.2,1); }
  @keyframes swoosh {
    0%{transform:translate(150px,-46px) rotate(16deg) scale(1.12,.9);opacity:0;}
    35%{opacity:1;} 55%{transform:translate(0,-6px) rotate(-3deg) scale(1.04,.96);}
    70%{transform:translate(0,0) rotate(1.5deg) scale(.9,1.12);}
    82%{transform:translate(0,0) rotate(-.5deg) scale(1.06,.95);}
    100%{transform:translate(0,0) rotate(0) scale(1,1);} }

  /* base / gatehouse */
  .tbase { position:relative; width:98px; height:48px; border:1.5px solid #5a5a5f; border-radius:7px 7px 4px 4px;
    box-shadow:inset 0 -5px 7px rgba(0,0,0,.24), inset 0 3px 5px rgba(255,255,255,.2),
      inset 2px 0 4px rgba(0,0,0,.12), inset -2px 0 4px rgba(0,0,0,.12), 0 2px 4px rgba(0,0,0,.3);
    overflow:hidden; display:flex; align-items:flex-end; justify-content:center; }
  .tbase .bbricks { position:absolute; inset:0; z-index:0; overflow:hidden; }
  .tbase .bbricks svg { position:absolute; inset:0; width:100%; height:100%; }
  .tbase .archring { position:absolute; bottom:0; left:50%; transform:translateX(-50%); z-index:1;
    width:42px; height:44px; border:4px solid #b8b8bc; border-bottom:none; border-radius:21px 21px 0 0; }
  .tbase .gate { position:relative; z-index:2; width:34px; height:38px; background:linear-gradient(180deg,#6a4724,#4a2f16);
    border:2px solid #2f1d0d; border-bottom:none; border-radius:17px 17px 0 0; box-shadow:inset 0 0 6px rgba(0,0,0,.5); }
  .tbase .gate::before { content:''; position:absolute; inset:0; border-radius:15px 15px 0 0;
    background:repeating-linear-gradient(90deg, transparent 0 7px, rgba(0,0,0,.3) 7px 8px); }
  .tbase .btorch { position:absolute; bottom:14px; width:3px; height:11px; background:#6a4a2a; z-index:3; }
  .tbase .btorch::after { content:''; position:absolute; top:-7px; left:-2.5px; width:8px; height:9px;
    background:radial-gradient(circle at 50% 70%,#ffe14d,#ff7e1a); border-radius:50%; box-shadow:0 0 7px #ffb43a; animation:flick .4s infinite alternate; }
  .tbase .btorch.l { left:9px; } .tbase .btorch.r { right:9px; }
  .tplinth { width:108px; height:12px; margin-top:-2px;
    background:linear-gradient(180deg,#9a9a9e,#7c7c81 60%,#6a6a6f);
    border:1.5px solid #5a5a5f; border-radius:5px;
    box-shadow:inset 0 2px 3px rgba(255,255,255,.2), inset 0 -2px 3px rgba(0,0,0,.2), 0 2px 3px rgba(0,0,0,.3);
    background-image:radial-gradient(ellipse 30px 6px at 30% 40%, rgba(255,255,255,.12), transparent 70%); }

  /* roof */
  .troof { position:relative; width:94px; height:18px; z-index:2;
    background:linear-gradient(180deg,#9a9a9e,#7c7c81 55%,#6a6a6f);
    border:1.5px solid #5a5a5f; border-bottom:none; border-radius:5px 5px 0 0;
    box-shadow:inset 0 2px 3px rgba(255,255,255,.22), inset 0 -3px 4px rgba(0,0,0,.18);
    overflow:visible; }
  .troof .rbricks { position:absolute; inset:0; z-index:0; overflow:hidden; border-radius:5px 5px 0 0; }
  .troof .rbricks svg { position:absolute; inset:0; width:100%; height:100%; }
  .troof > *:not(.rbricks) { position:relative; z-index:1; }
  /* crenellations get their own stone fill so they aren't transparent */
  .troof::before { content:''; position:absolute; top:-9px; left:-2px; right:-2px; height:10px;
    background:repeating-linear-gradient(90deg,#8a8a8e 0 12px, #6a6a6f 12px 13px, transparent 13px 20px);
    border-top:1.5px solid #5a5a5f; filter:drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
  .troof .cap { position:absolute; top:-44px; left:50%; transform:translateX(-50%); z-index:2;
    width:0; height:0; border-left:30px solid transparent; border-right:30px solid transparent; border-bottom:40px solid #b5472f;
    filter:drop-shadow(-3px 0 0 rgba(255,255,255,.12)) drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
  .troof .flagpole { position:absolute; top:-78px; left:50%; width:3px; height:42px; background:linear-gradient(#6a5a3a,#4a3a22); transform:translateX(-50%); z-index:3; }
  .troof .flagpole::after { content:''; position:absolute; top:-5px; left:-2px; width:7px; height:7px; background:#ffce3a; border-radius:50%; box-shadow:0 0 5px #ffce3a; }
  .troof .flag { position:absolute; top:-76px; left:calc(50% + 1px); width:26px; height:16px; z-index:3;
    background:linear-gradient(135deg,#d6452c,#a8331f); clip-path:polygon(0 0,100% 0,78% 50%,100% 100%,0 100%);
    transform-origin:left center; animation:flagWave 1.6s ease-in-out infinite; }
  .troof .flag::after { content:'★'; position:absolute; left:5px; top:1px; font-size:10px; color:#ffe14d; }
  @keyframes flagWave { 0%,100%{transform:skewY(0) scaleX(1);} 25%{transform:skewY(5deg) scaleX(.94);} 50%{transform:skewY(0) scaleX(1);} 75%{transform:skewY(-5deg) scaleX(.94);} }
  .troof .pennant { position:absolute; top:2px; width:8px; height:11px; z-index:2; clip-path:polygon(0 0,100% 0,50% 100%); animation:pennant 2.2s ease-in-out infinite; transform-origin:top; }
  .troof .pennant.l { left:4px; background:#3a7ad0; } .troof .pennant.r { right:4px; background:#caa23a; }
  @keyframes pennant { 0%,100%{transform:rotate(-6deg);} 50%{transform:rotate(6deg);} }

  .dust { position:absolute; font-size:26px; opacity:0; pointer-events:none; z-index:40; }
  .dust.show { animation:dustPuff .7s ease-out; }
  @keyframes dustPuff { 0%{opacity:0;transform:scale(.4);} 30%{opacity:.9;} 100%{opacity:0;transform:scale(1.6) translateY(-10px);} }
  .floor-popup { position:absolute; left:50%; transform:translateX(-50%); top:6px;
    background:#ffce3a; color:#7a4a00; font-weight:bold; font-size:13px; padding:2px 8px; border-radius:10px;
    border:2px solid #d49a1a; white-space:nowrap; z-index:60; animation:floatUp 1.6s ease-out forwards; pointer-events:none; }
  @keyframes floatUp { 0%{opacity:0;transform:translate(-50%,10px) scale(.6);} 20%{opacity:1;transform:translate(-50%,0) scale(1);} 80%{opacity:1;} 100%{opacity:0;transform:translate(-50%,-24px) scale(1);} }
  .tower-panel.shake { animation:pshake .35s ease-in-out; }
  @keyframes pshake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-3px);} 75%{transform:translateX(3px);} }

  /* ===== Vertical ruler (left edge) — always visible, full height ===== */
  .ruler { position:absolute !important; left:0 !important; top:0 !important; height:100% !important;
    width:50px !important; z-index:60 !important; pointer-events:none; display:none; }
  .ruler.show { display:block !important; }
  .ruler-bg { position:absolute !important; left:0 !important; top:0 !important; width:100% !important; height:100% !important;
    background:linear-gradient(90deg,#4a3a22 0%,#6e5a36 60%,#5a4628 100%) !important;
    border-right:3px solid #8a7248; box-shadow:3px 0 8px rgba(0,0,0,.35); z-index:0; }
  .ruler-track { position:absolute; left:0; right:0; top:66px; bottom:40px; z-index:2; }
  .ruler-tick { position:absolute; left:8px; height:2px; background:rgba(255,236,190,.65); width:9px; }
  .ruler-tick.major { width:22px; height:3px; background:#ffe9b0; }
  .ruler-label { position:absolute; left:14px; transform:translateY(50%); font-size:11px; font-weight:bold;
    color:#ffe9b0; text-shadow:0 1px 2px rgba(0,0,0,.8); white-space:nowrap; }
  .ruler-label.milestone { color:#ffe14d; font-size:12px; }
  .ruler-marker { position:absolute; left:0; transform:translateY(50%); bottom:0;
    transition:bottom 1.0s cubic-bezier(.4,0,.2,1); z-index:3; }
  .ruler-marker .arrow { font-size:20px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .ruler-cap { position:absolute; left:0; width:50px; height:30px; display:flex; align-items:center; justify-content:center;
    font-size:14px; color:#ffe9b0; font-weight:bold; z-index:2; }
  .ruler-cap.top { top:30px; }
  .ruler-cap.bot { bottom:6px; flex-direction:column; line-height:1.1; }
  .ruler-cap.bot small { font-size:8px; opacity:.85; }

  /* ===== Puzzle UIs ===== */
  .build-stage { position:relative; display:flex; align-items:flex-end; justify-content:center; gap:26px; margin-top:30px; }
  .build-area { position:relative; width:230px; height:280px; }
  .slot { position:absolute; border:4px dashed rgba(255,255,255,.85); border-radius:10px; background:rgba(255,255,255,.15); }
  .slot.filled { border-style:solid; }
  .brick { border-radius:10px; cursor:grab; z-index:30; box-shadow:inset 0 -8px 0 rgba(0,0,0,.18),0 4px 6px rgba(0,0,0,.25);
    display:flex; align-items:center; justify-content:center; touch-action:none; flex:0 0 auto; position:relative; }
  .tray { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:12px; z-index:25;
    background:rgba(255,255,255,.18); border-radius:18px; padding:14px 12px; border:3px dashed rgba(255,255,255,.5); }
  .pattern-row { display:flex; gap:14px; margin:16px; flex-wrap:wrap; justify-content:center; }
  .pcell { width:60px; height:60px; border-radius:12px; border:4px solid rgba(0,0,0,.15); box-shadow:inset 0 -6px 0 rgba(0,0,0,.18); }
  .pslot { width:60px; height:60px; border-radius:12px; border:4px dashed #fff; background:rgba(255,255,255,.2);
    display:flex; align-items:center; justify-content:center; font-size:28px; color:#fff; }

<script>
/* ============ AUDIO ============ */
let actx, soundOn=true, musicOn=true;
function ac(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function beep(f,d,t,v){ if(!soundOn) return; try{ const c=ac(),o=c.createOscillator(),g=c.createGain();
  o.type=t||'square'; o.frequency.value=f; g.gain.value=v||0.12; o.connect(g); g.connect(c.destination);
  o.start(); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+(d||0.15)); o.stop(c.currentTime+(d||0.15)); }catch(e){} }
function sndClick(){ beep(660,0.08,'square'); }
function sndSnap(){ beep(440,0.1,'square'); setTimeout(()=>beep(880,0.12,'square'),60); }
function sndGood(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.14,'square'),i*90)); }
function sndWin(){ [523,659,784,1047,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.16,'triangle',0.14),i*120)); }
function sndOops(){ beep(220,0.18,'sawtooth',0.08); }
function sndPuff(){ beep(180,0.3,'sawtooth',0.1); setTimeout(()=>beep(120,0.3,'sawtooth',0.08),120); }
function sndPlop(){ beep(300,0.08,'sine',0.14); setTimeout(()=>beep(150,0.18,'sine',0.16),80); }
function sndSneeze(){ [400,500,650].forEach((f,i)=>setTimeout(()=>beep(f,0.12,'triangle',0.08),i*180)); setTimeout(()=>{ beep(900,0.05,'sawtooth',0.16); beep(300,0.35,'sawtooth',0.14); },560); }
function sndTummy(){ [110,90,130,85].forEach((f,i)=>setTimeout(()=>beep(f,0.22,'sine',0.12),i*180)); }
function sndMunch(){ [260,200,260,200].forEach((f,i)=>setTimeout(()=>beep(f,0.1,'square',0.1),i*140)); }
function sndFart(){ beep(95,0.18,'sawtooth',0.16); setTimeout(()=>beep(70,0.28,'sawtooth',0.15),150); setTimeout(()=>beep(110,0.14,'sawtooth',0.13),420); }
function sndBrick(){
  if(!soundOn) return;
  try{
    const c=ac(), now=c.currentTime;
    // ---- Layer 1: gritty GRIND (stone pressed & dragging between others) ----
    const dur=0.5;
    const buf=c.createBuffer(1, c.sampleRate*dur, c.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++){
      const t=i/d.length;
      // coarse grain: mix of noise + slow amplitude wobble = grinding texture
      const grind=(Math.random()*2-1) * (0.6+0.4*Math.sin(t*60));
      const env=Math.min(1, t*8) * (1-t); // quick attack, long friction tail
      d[i]=grind*env;
    }
    const ns=c.createBufferSource(); ns.buffer=buf;
    const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=2.2;
    // pitch presses DOWN as the stone settles into the gap (friction easing)
    bp.frequency.setValueAtTime(2200, now);
    bp.frequency.exponentialRampToValueAtTime(650, now+dur);
    const ng=c.createGain(); ng.gain.setValueAtTime(0.001, now);
    ng.gain.linearRampToValueAtTime(0.26, now+0.04);
    ng.gain.linearRampToValueAtTime(0.08, now+dur*0.55);
    ng.gain.linearRampToValueAtTime(0.001, now+dur);
    ns.connect(bp); bp.connect(ng); ng.connect(c.destination); ns.start();
    // ---- Layer 2: low rumble of heavy stone shifting ----
    const o=c.createOscillator(), g=c.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(70, now); o.frequency.linearRampToValueAtTime(48, now+dur*0.6);
    g.gain.setValueAtTime(0.06, now); g.gain.linearRampToValueAtTime(0.001, now+dur*0.6);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(now+dur*0.65);
    // ---- Layer 3: final SEATED thunk (stone locks into place) ----
    setTimeout(()=>{
      const t2=c.currentTime;
      const o2=c.createOscillator(), g2=c.createGain();
      o2.type='triangle'; o2.frequency.setValueAtTime(150,t2); o2.frequency.exponentialRampToValueAtTime(60,t2+0.14);
      g2.gain.setValueAtTime(0.22,t2); g2.gain.exponentialRampToValueAtTime(0.001,t2+0.18);
      o2.connect(g2); g2.connect(c.destination); o2.start(); o2.stop(t2+0.2);
      // tiny dust grit on impact
      const b3=c.createBuffer(1,c.sampleRate*0.1,c.sampleRate); const dd=b3.getChannelData(0);
      for(let i=0;i<dd.length;i++) dd[i]=(Math.random()*2-1)*Math.pow(1-i/dd.length,3);
      const n3=c.createBufferSource(); n3.buffer=b3; const f3=c.createBiquadFilter(); f3.type='highpass'; f3.frequency.value=2500;
      const g3=c.createGain(); g3.gain.value=0.1; n3.connect(f3); f3.connect(g3); g3.connect(c.destination); n3.start();
    }, 460);
  }catch(e){}
}

/* ============ MUSIC ============ */
let musicTimer=null, musicGain=null;
const MELODY=[[294,1],[330,1],[392,1.5],[330,0.5],[294,1],[262,1],[294,2],[392,1],[440,1],[392,1],[330,1],[294,1.5],[262,0.5],[294,2]];
function musGain(){ const c=ac(); if(!musicGain){ musicGain=c.createGain(); musicGain.gain.value=0.05; musicGain.connect(c.destination); } return musicGain; }
function musNote(f,d){ const c=ac(),o=c.createOscillator(),g=c.createGain(); o.type='triangle'; o.frequency.value=f;
  g.gain.value=0; o.connect(g); g.connect(musGain()); const t=c.currentTime;
  g.gain.linearRampToValueAtTime(0.5,t+0.05); g.gain.linearRampToValueAtTime(0.001,t+d); o.start(t); o.stop(t+d+0.05); }
function startMusic(){ if(!musicOn||musicTimer) return; musGain(); let i=0; const beat=0.42;
  (function tick(){ if(!musicOn){ musicTimer=null; return; } const n=MELODY[i%MELODY.length]; musNote(n[0],n[1]*beat*0.9);
    if(i%4===0) musNote(73,beat*4); i++; musicTimer=setTimeout(tick,n[1]*beat*1000); })(); }
function stopMusic(){ if(musicTimer){ clearTimeout(musicTimer); musicTimer=null; } }
function toggleMusic(){ musicOn=!musicOn; document.getElementById('musicBtn').classList.toggle('off',!musicOn); if(musicOn) startMusic(); else stopMusic(); }

/* ============ VOICE ============ */
let svVoice=null, lastSpoken='';
function pickVoice(){ const vs=speechSynthesis.getVoices(); svVoice=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('sv'))||null; }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(t){ lastSpoken=t; if(!soundOn||!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='sv-SE'; if(svVoice)u.voice=svVoice; u.rate=0.92; u.pitch=1.15; speechSynthesis.speak(u); }catch(e){} }
function readCurrent(){ if(lastSpoken) speak(lastSpoken); }
function toggleSound(){ soundOn=!soundOn; const b=document.getElementById('soundBtn'); b.textContent=soundOn?'🔊':'🔇'; b.classList.toggle('off',!soundOn);
  if(!soundOn&&'speechSynthesis' in window) speechSynthesis.cancel(); else if(soundOn) readCurrent(); }

/* ============ STATE ============ */
let floors=0, step=0, nextSilly=3, sillyPool=[0,1,2,3,4];
const LEVELS=['build','pattern','odd','count','sort'];
const FLOOR_COLORS=['#e84d4d','#4caf50','#42a5f5','#ffce3a','#ab47bc','#ff9800','#26c6da','#ec407a','#9ccc65','#5c6bc0'];
const FLOOR_H=32, BASE_H=60, SKY_MAX=6200, STATIC_FLOORS=5;

function setFloors(n){ floors=n; document.getElementById('floorCount').textContent='🏰 '+n; }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active');
  const playing=(id==='play'||id==='scene');
  const tp=document.getElementById('towerPanel'); if(tp) tp.style.display=playing?'block':'none';
  const rl=document.getElementById('ruler'); if(rl) rl.classList.toggle('show',playing);
  if(playing) updateMeter(); }

/* ============ MAJISTO SVG ============ */
function majistoSVG(){
  return '<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg"><defs>'
   +'<linearGradient id="robe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a63d0"/><stop offset="0.5" stop-color="#2a4fb0"/><stop offset="1" stop-color="#1d3a8c"/></linearGradient>'
   +'<linearGradient id="hatG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a63d0"/><stop offset="1" stop-color="#22409a"/></linearGradient>'
   +'<radialGradient id="faceG" cx="0.5" cy="0.4" r="0.7"><stop offset="0" stop-color="#ffe2c4"/><stop offset="1" stop-color="#f0bd92"/></radialGradient>'
   +'<linearGradient id="beardG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d8e0ea"/></linearGradient>'
   +'<linearGradient id="undiesG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9ecb"/><stop offset="1" stop-color="#ff6fae"/></linearGradient></defs>'
   +'<g class="m-robe-full">'
   +'<g class="m-armL"><path d="M62,150 Q40,168 46,205 L64,200 Q60,172 76,158 Z" fill="url(#robe)" stroke="#1d3a8c" stroke-width="2"/><circle cx="52" cy="204" r="11" fill="url(#faceG)" stroke="#e0a878" stroke-width="1.5"/></g>'

/* ============ TOWER ============ */
function panelH(){ return document.getElementById('towerPanel').clientHeight; }
function frand(i,salt){ const x=Math.sin((i+1)*12.9898+salt*78.233)*43758.5453; return x-Math.floor(x); }
/* procedural fieldstone wall (like a real rubble/castle wall) for one floor */
function stoneSVG(seed, baseHex, w, h){
  // deterministic RNG seeded per floor
  let s=seed*9301+49297;
  function rnd(){ s=(s*9301+49297)%233280; return s/233280; }
  function shade(hex,amt){
    const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
    r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
    return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }
  let svg='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">';
  // dark mortar background
  svg+='<rect width="'+w+'" height="'+h+'" fill="'+shade(baseHex,-46)+'"/>';
  const rowH=h/3.0;                 // ~3 stone courses per floor
  let y=1;
  while(y<h-1){
    const rh=rowH*(0.8+rnd()*0.5);
    let x=1+rnd()*3;
    while(x<w-1){
      const sw=Math.max(7, (w/5)*(0.6+rnd()*0.9));
      const ex=Math.min(w-1, x+sw);
      const tone=Math.floor((rnd()-0.5)*36);      // per-stone tonal variation
      const fill=shade(baseHex,tone);
      const rx=2+rnd()*3;
      const pad=0.8+rnd()*0.8;                     // mortar gap
      const sx=x+pad, sy=y+pad, sW=Math.max(4,(ex-x)-pad*2), sH=Math.max(4,rh-pad*2);
      // stone body
      svg+='<rect x="'+sx.toFixed(1)+'" y="'+sy.toFixed(1)+'" width="'+sW.toFixed(1)+'" height="'+sH.toFixed(1)+'" rx="'+rx.toFixed(1)+'" fill="'+fill+'"/>';
      // top light edge
      svg+='<rect x="'+sx.toFixed(1)+'" y="'+sy.toFixed(1)+'" width="'+sW.toFixed(1)+'" height="'+(sH*0.32).toFixed(1)+'" rx="'+rx.toFixed(1)+'" fill="'+shade(fill,26)+'" opacity="0.55"/>';
      // bottom shadow
      svg+='<rect x="'+sx.toFixed(1)+'" y="'+(sy+sH*0.66).toFixed(1)+'" width="'+sW.toFixed(1)+'" height="'+(sH*0.34).toFixed(1)+'" rx="'+rx.toFixed(1)+'" fill="'+shade(fill,-28)+'" opacity="0.5"/>';
      x=ex+0.5;
    }
    y+=rh;
  }
  // subtle overall vignette for depth
  svg+='<rect width="'+w+'" height="'+h+'" fill="url(#vg'+seed+')"/>';
  svg+='<defs><radialGradient id="vg'+seed+'" cx="50%" cy="35%" r="75%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.22"/></radialGradient></defs>';
  svg+='</svg>';
  return svg;
}
const STONE_TONES=['#9a9a9e','#a89484','#8d8d96','#9c8d7a','#8a9a8d','#a89a9a','#94928c','#9a8f7e','#8f9aa6','#a99b6f','#94817a','#88928a','#9e9aa2','#a08c74','#8c8c90'];
function decorateFloor(f,i){
  const variant=Math.floor(frand(i,1)*15);
  const wv=Math.floor(frand(i,6)*5); if(wv>0) f.classList.add('w'+wv);
  const base=STONE_TONES[variant];
  const bricks=document.createElement('div'); bricks.className='bricks';
  // floor width varies a touch; use ~80 design units
  bricks.innerHTML=stoneSVG(i+1, base, 80, 34);
  f.appendChild(bricks);
  const wins=frand(i,2)<0.34?2:1;
  for(let w=0;w<wins;w++){ const win=document.createElement('div'); win.className='win'+((frand(i,3)<0.4)?' lit':''); f.appendChild(win); }
  const r=frand(i,4);
  if(variant===4||variant===11){ const v=document.createElement('div'); v.className='vines'; f.appendChild(v); }
  if(variant===9||r>0.82){ const fm=document.createElement('div'); fm.className='flagm'; f.appendChild(fm); }
  if(r>0.5&&r<0.66){ const t1=document.createElement('div'); t1.className='torch l'; const t2=document.createElement('div'); t2.className='torch r'; f.appendChild(t1); f.appendChild(t2); }
  if(i%5===4){ const bd=document.createElement('div'); bd.className='banner-deco'; f.appendChild(bd); }
}

function applySway(){
  const inner=document.getElementById('towerInner');
  if(floors<4){ inner.classList.remove('sway'); return; }
  const amt=Math.min(2.2,0.25+floors*0.045), dur=Math.max(2.6,5.2-floors*0.02);
  inner.style.setProperty('--sw',amt+'deg'); inner.style.setProperty('--sd',dur.toFixed(2)+'s'); inner.classList.add('sway');
}

/* ============ CAMERA (static floors 1-5, then scroll) ============ */
function computeClimb(){ if(floors<=STATIC_FLOORS) return 0;
  const climb=(floors-STATIC_FLOORS)*FLOOR_H; const maxClimb=SKY_MAX-panelH(); return Math.min(climb,maxClimb); }
function updateCamera(){
  const climb=computeClimb();
  const world=document.getElementById('towerWorld'), bg=document.getElementById('castleBg'), ground=document.getElementById('worldGround'), space=document.getElementById('spaceLayer');
  if(climb<=0){
    if(world) world.style.transform='translateY(0px)';
    if(bg) bg.style.transform='scale(1.04) translateY(0px)';
    if(ground) ground.style.transform='translateY(0px)';
  } else {
    if(world) world.style.transform='translateY('+climb+'px)';
    if(bg) bg.style.transform='scale(1.04) translateY('+Math.min(climb*0.5,560)+'px)';
    if(ground) ground.style.transform='translateY('+Math.min(climb*0.7,360)+'px)';
  }
  if(space){ const t=Math.max(0,Math.min(1,(floors-55)/45)); space.style.opacity=t.toFixed(2); }
  updateMeter();
}
function updateMeter(){
  const game=document.getElementById('game');
  if(!game) return;
  let ruler=document.getElementById('ruler');
  if(!ruler){
    ruler=document.createElement('div'); ruler.id='ruler';
    ruler.style.cssText='position:absolute;left:0;top:0;bottom:0;width:54px;z-index:36;pointer-events:none;';
    game.appendChild(ruler);
  }
  const playing = document.getElementById('play').classList.contains('active') || document.getElementById('scene').classList.contains('active');
  ruler.style.display = playing ? 'block' : 'none';
  if(!playing) return;

  const H=game.clientHeight || 700;
  const W=54;
  const baseTopFromBottom = 66 + BASE_H;
  const climb = computeClimb();
  function floorScreenBottom(n){ return baseTopFromBottom + n*FLOOR_H - climb; }
  const topFloor = Math.max(20, floors+8);
  const milestones={5:'☁️',50:'🚀',75:'⭐',100:'🌙'};
  let html='';
  // wooden ruler background
  html+='<div style="position:absolute;left:0;top:0;width:'+W+'px;height:100%;background:linear-gradient(90deg,#4a3a22,#6e5a36 60%,#5a4628);border-right:3px solid #8a7248;box-shadow:3px 0 8px rgba(0,0,0,.35);"></div>';
  for(let n=0;n<=topFloor;n++){
    const y=H-floorScreenBottom(n);
    if(y<14 || y>H-4) continue;
    const major=(n%5===0)||n===0;
    // tick

function makeDraggable(el,slots,area,tray,onPlace){
  let drag=false,ox,oy,placed=false;
  function down(e){ if(placed)return; drag=true; el.style.zIndex=100; const pt=getPt(e),r=el.getBoundingClientRect(); ox=pt.x-r.left; oy=pt.y-r.top;
    el.style.position='fixed'; el.style.left=r.left+'px'; el.style.top=r.top+'px'; el.style.margin='0'; sndClick(); e.preventDefault(); }
  function move(e){ if(!drag)return; const pt=getPt(e); el.style.left=(pt.x-ox)+'px'; el.style.top=(pt.y-oy)+'px'; e.preventDefault(); }
  function up(e){ if(!drag)return; drag=false; const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    const target=slots.find(s=>s.dataset.idx===el.dataset.idx),sr=target.getBoundingClientRect();
    if(Math.hypot(cx-(sr.left+sr.width/2),cy-(sr.top+sr.height/2))<80){ placed=true; el.style.zIndex=30; const ar=area.getBoundingClientRect();
      el.style.position='absolute'; el.style.left=(sr.left-ar.left+sr.width/2)+'px'; el.style.top=(sr.top-ar.top)+'px'; el.style.transform='translateX(-50%)'; area.appendChild(el); target.classList.add('filled'); sndSnap(); onPlace();
    } else { el.style.position='relative'; el.style.left=''; el.style.top=''; el.style.transform=''; el.style.zIndex='30'; tray.appendChild(el); sndOops(); } }
  el.addEventListener('mousedown',down); el.addEventListener('touchstart',down,{passive:false});
  window.addEventListener('mousemove',move); window.addEventListener('touchmove',move,{passive:false}); window.addEventListener('mouseup',up); window.addEventListener('touchend',up);
}

    fix:(m,p,t)=>{ sndFart(); const g=document.getElementById('gasCloud'); g.classList.remove('show'); void g.offsetWidth; g.classList.add('show'); m.classList.add('anim-relief'); p.textContent='😅'; t.innerHTML='Pffff... 💨😂<br>Hihi! Ursäkta! Tack Beppe!'; },
    fixSay:'Pffffrt! Hihi, ursäkta! Tack Beppe som viftade bort pruttmolnet!' }
];
function sillyScene(){
  show('scene');
  const pick=Math.floor(Math.random()*sillyPool.length); currentScene=sillyPool.splice(pick,1)[0];
  const sc=SCENES[currentScene];
  const m=document.getElementById('sceneMajisto'); m.className='majisto-svg'; m.innerHTML=sceneArt(sc.art);
  document.getElementById('sceneToilet').style.display='none'; document.getElementById('sceneProp').style.display='none';
  document.getElementById('gasCloud').classList.remove('show'); document.getElementById('magicBtn').style.display='block';
  sc.setup(m,document.getElementById('puff'),document.getElementById('sceneText')); if(sc.snd) sc.snd(); speak(sc.say);
}
function fixScene(){
  sndSnap(); showFeedback('✨'); confetti(); const sc=SCENES[currentScene];
  sc.fix(document.getElementById('sceneMajisto'),document.getElementById('puff'),document.getElementById('sceneText'));
  document.getElementById('magicBtn').style.display='none'; speak(sc.fixSay); setTimeout(loadStep,3000);
}

  setTimeout(()=>{ if(document.getElementById('start').classList.contains('active')) speak('Majistos torn! Hjälp Majisto bygga sitt torn så högt som möjligt!'); },600); });
window.addEventListener('resize',()=>{ if(floors>0) updateCamera(); });
